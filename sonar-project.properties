# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree and
# reads the report its `coverage` job wrote. Automatic Analysis is off for this
# project: SonarCloud refuses a CI scan of a project that has it on.
sonar.projectKey=lemonfiber_lemonfiber-fence
sonar.organization=lemonfiber

# The crate, the workflows and the image. `scripts/` is left out: its one file is a
# copy of the spec's `shared/gates/no_open_codeql_alert.py`, analysed at its home.
sonar.sources=src,.github,Dockerfile
sonar.tests=src
# A module's tests live beside it in `<name>/tests.rs`, and that shape is what marks a
# file as test code.
sonar.test.inclusions=**/tests.rs

# S8431 asks for an image to be named by its tag or by its digest, not both. Every
# image a Dockerfile here builds from is named as `tag@sha256:...` on purpose: the
# digest is what the build pulls, and the tag is how a reader and Dependabot tell which
# version that digest is.
sonar.issue.ignore.multicriteria=imagepins
sonar.issue.ignore.multicriteria.imagepins.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.imagepins.resourceKey=**/Dockerfile*

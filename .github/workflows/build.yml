# The crate and the image, checked on every change: format, lints, tests, the
# toolchain the crate promises, its dependency policy, and an image build.
name: build
on:
  pull_request:
  merge_group:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The tests run once, under coverage in sonar.yml, whose `coverage` job
      # fails on a failing test as this step did.

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version the crate promises
        id: promised
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version is declared, so there is no promise to collect on"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: ${{ steps.promised.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The crate builds on the version it promises
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.promised.outputs.version }}
        run: cargo check --locked

  # cargo-deny as a binary rather than through its action, which builds a Docker
  # image from a Docker Hub base on every run and fails whenever Hub rate-limits
  # the runners. The version and the arguments are the ones that action ran.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-deny
        with:
          tool: cargo-deny@0.20.2
      - name: The dependencies are allowed
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  # The image builds, runs with nothing but `NET_ADMIN`, as lemonfiber runs it, and
  # answers its own health check once its rules are in force. A service written into
  # its namespace on a network of its own, as the stack's are, is then refused every
  # private address and reaches a name and the internet. Run as `fence stack`, a service
  # in its namespace reaches the stack's own network and nothing beyond it. Nothing is
  # pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t fence:check .
      - name: Puts a ruleset in place, reads it back and removes it, holding NET_ADMIN alone
        run: |
          set -euo pipefail
          code=0
          said=$(docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN \
            fence:check nftables 2>&1) || code=$?
          if [ "$code" -ne 0 ] || [ "$said" != held ]; then
            echo "::error::the fence's nftables probe exited ${code} and answered '${said}', not 'held'"
            exit 1
          fi
      - name: Holds its namespace to the rules, and answers its health
        run: |
          set -euo pipefail
          docker network create fence-check >/dev/null
          docker run -d --name fence-check --network fence-check --read-only \
            --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges \
            -e LEMONFIBER_FENCE_HOST_ADDRESSES=203.0.113.9 fence:check
          healthy=no
          for _ in $(seq 1 20); do
            if docker exec fence-check /usr/local/bin/fence health; then
              healthy=yes
              break
            fi
            sleep 1
          done
          if [ "$healthy" != yes ]; then
            docker logs fence-check
            echo "::error::the fence did not report its rules in force"
            exit 1
          fi
      - name: A service behind it is refused every private address and reaches the internet
        run: |
          set -euo pipefail
          docker run --rm --network container:fence-check --cap-drop ALL \
            --entrypoint /bin/sh fence:check -c '
              failed=0
              for target in 10.0.0.1 172.17.0.1 192.168.1.1 100.64.0.1 169.254.169.254 127.0.0.1 198.18.0.1 203.0.113.9; do
                if nc -z -w 2 "$target" 80 2>/dev/null; then
                  echo "::error::$target was reached from behind the fence"
                  failed=1
                fi
              done
              if nc -z -w 2 127.0.0.11 80 2>/dev/null; then
                echo "::error::the resolver was reached on a port other than its own"
                failed=1
              fi
              if ! nslookup example.com >/dev/null 2>&1; then
                echo "::error::a name did not resolve behind the fence"
                failed=1
              fi
              if ! wget -q -T 10 -O /dev/null https://example.com; then
                echo "::error::the internet was not reached behind the fence"
                failed=1
              fi
              exit "$failed"'
      - name: Asks a service in the namespace it joins on loopback, holding no capability
        run: |
          set -euo pipefail
          docker run -d --name fence-check-service --network container:fence-check --cap-drop ALL \
            --entrypoint /bin/sh fence:check -c '
              while true; do
                printf "HTTP/1.0 200 OK\r\nContent-Type: text/plain\r\n\r\nheard" | nc -l -p 8191 >/dev/null
              done' >/dev/null
          said=""
          for _ in $(seq 1 10); do
            if said=$(docker run --rm --network container:fence-check --read-only --cap-drop ALL \
              --security-opt no-new-privileges --memory 32m fence:check ask GET 8191 /); then
              break
            fi
            sleep 1
          done
          docker rm -fv fence-check-service >/dev/null
          expected=$(printf '200\ntext/plain\nheard')
          if [ "$said" != "$expected" ]; then
            echo "::error::fence ask printed '${said}', not the service's status, content type and body"
            exit 1
          fi
      - name: Refuses to start without the host's own addresses
        run: |
          set -euo pipefail
          for said in unset " , "; do
            if [ "$said" = unset ]; then
              set -- fence:check
            else
              set -- -e "LEMONFIBER_FENCE_HOST_ADDRESSES=${said}" fence:check
            fi
            code=0
            docker run --rm --network fence-check --cap-drop ALL --cap-add NET_ADMIN "$@" || code=$?
            if [ "$code" -ne 2 ]; then
              echo "::error::with the host's addresses ${said}, the fence exited ${code} rather than refusing to start"
              exit 1
            fi
          done
      - name: Holds a service inside the stack's networks, refusing everything beyond them
        run: |
          set -euo pipefail
          docker network create --subnet 172.30.7.0/24 --gateway 172.30.7.1 fence-stack >/dev/null
          docker run -d --name fence-stack-peer --network fence-stack --cap-drop ALL \
            --entrypoint /bin/sh fence:check -c 'while true; do nc -l -p 8080 >/dev/null; done' >/dev/null
          docker run -d --name fence-stack --network fence-stack --read-only \
            --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges --dns-search . \
            -e LEMONFIBER_FENCE_HOST_ADDRESSES=203.0.113.9 \
            -e LEMONFIBER_FENCE_NETWORKS=172.30.7.0/24=172.30.7.1 \
            -e LEMONFIBER_FENCE_NAMES=fence-stack-peer fence:check stack
          healthy=no
          for _ in $(seq 1 20); do
            if docker exec fence-stack /usr/local/bin/fence health; then
              healthy=yes
              break
            fi
            sleep 1
          done
          if [ "$healthy" != yes ]; then
            docker logs fence-stack
            echo "::error::the stack-only fence did not report its rules in force"
            exit 1
          fi
          docker run --rm --network container:fence-stack --cap-drop ALL \
            --entrypoint /bin/sh fence:check -c '
              failed=0
              if ! nc -z -w 2 fence-stack-peer 8080; then
                echo "::error::a service inside the stack was not reached by name"
                failed=1
              fi
              for target in 172.30.7.1 203.0.113.9 10.0.0.1 192.168.1.1 169.254.169.254 1.1.1.1; do
                if nc -z -w 2 "$target" 80 2>/dev/null; then
                  echo "::error::$target was reached from inside the stack"
                  failed=1
                fi
              done
              if wget -q -T 5 -O /dev/null https://example.com 2>/dev/null; then
                echo "::error::the internet was reached from inside the stack"
                failed=1
              fi
              outside=$(nslookup example.com 2>/dev/null || true)
              if echo "$outside" | grep -q "^Name:"; then
                echo "::error::a name outside the stack resolved from inside it"
                failed=1
              fi
              if ! nslookup fence-stack-peer 2>/dev/null | grep -q "^Address.*172\.30\.7\."; then
                echo "::error::a service inside the stack did not resolve by name"
                failed=1
              fi
              exit "$failed"'
          docker rm -fv fence-stack fence-stack-peer >/dev/null
          docker network rm fence-stack >/dev/null
      - name: Refuses to hold a service inside the stack without its networks
        run: |
          set -euo pipefail
          for said in unset " , " 172.30.8.0/24 172.30.8.0/24=172.30.9.1; do
            if [ "$said" = unset ]; then
              set -- -e LEMONFIBER_FENCE_HOST_ADDRESSES=203.0.113.9 fence:check stack
            else
              set -- -e LEMONFIBER_FENCE_HOST_ADDRESSES=203.0.113.9 \
                -e "LEMONFIBER_FENCE_NETWORKS=${said}" -e LEMONFIBER_FENCE_NAMES=peer fence:check stack
            fi
            code=0
            docker run --rm --network fence-check --cap-drop ALL --cap-add NET_ADMIN "$@" || code=$?
            if [ "$code" -ne 2 ]; then
              echo "::error::with the networks ${said}, the stack-only fence exited ${code} rather than refusing to start"
              exit 1
            fi
          done
      - name: Answers the host's own addresses on the host's network, holding no capability
        run: |
          set -euo pipefail
          said=$(docker run --rm --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges fence:check addresses)
          if [ -z "$said" ]; then
            echo "::error::the fence answered no address of the host"
            exit 1
          fi
          expected=$(docker run --rm --network host --entrypoint /bin/sh fence:check -c \
            "ip -o addr | awk '{split(\$4, a, \"/\"); print a[1]}'")
          for address in $expected; do
            if ! grep -qxF "$address" <<<"$said"; then
              echo "::error::the host holds ${address}, and the fence did not answer it"
              exit 1
            fi
          done
          if grep -vqE '^[0-9a-f.:]+$' <<<"$said"; then
            echo "::error::the fence answered a line that is not an address: ${said}"
            exit 1
          fi
      - name: Reports the rules gone once they are
        run: |
          set -euo pipefail
          docker exec fence-check nft delete table inet lemonfiber_fence
          if docker exec fence-check /usr/local/bin/fence health; then
            echo "::error::the fence reported rules in force that are gone"
            exit 1
          fi

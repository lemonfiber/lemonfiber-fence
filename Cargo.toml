[package]
name = "lemonfiber-fence"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-fence"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The fence: the container that holds a fenced service's network namespace to rules refusing every private address"
publish = false

[[bin]]
name = "fence"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
